spring.config.import=optional:file:.env[.properties]
  
spring.application.name=SlotlyV2

# Database Connection
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

#Logging
logging.level.root=INFO
logging.level.com.example.SlotlyV2=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

#JWT Configuration
jwt.secret-key=${JWT_SECRET_KEY}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

#Resend Configuration
resend.api-key=${RESEND_API_KEY}
email.from-email=${EMAIL_FROM}
email.from-name=Slotly

#Base url
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# Rate Limiting Configuration
app.ratelimit.global-capacity=1000
app.ratelimit.global-refill=1m
app.ratelimit.login-capacity=5
app.ratelimit.login-refill=5m
app.ratelimit.register-capacity=3
app.ratelimit.register-refill=1h
app.ratelimit.booking-capacity=10
app.ratelimit.booking-refill=1m
app.ratelimit.password-reset-capacity=3
app.ratelimit.password-reset-refill=1h

# Google Calendar API Configuration
google.calendar.application-name=Slotly
google.calendar.client-id=${GOOGLE_CLIENT_ID}
google.calendar.client-secret=${GOOGLE_CLIENT_SECRET}
google.calendar.redirect-uri=${GOOGLE_REDIRECT_URI}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Frontend URL for OAuth callback
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
